<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QueryMind — AI-Powered Data Analyst (DuckDB-WASM + BYOK)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute; visibility:hidden;" aria-hidden="true">
    <defs>
      <symbol id="qm-grid" viewBox="0 0 64 64">
        <path d="M12,0 H26 A3,3 0 0 1 29,3 V26 A3,3 0 0 1 26,29 H3 A3,3 0 0 1 0,26 V12 A12,12 0 0 1 12,0 Z"/>
        <path d="M38,0 H52 A12,12 0 0 1 64,12 V26 A3,3 0 0 1 61,29 H38 A3,3 0 0 1 35,26 V3 A3,3 0 0 1 38,0 Z"/>
        <path d="M3,35 H26 A3,3 0 0 1 29,38 V61 A3,3 0 0 1 26,64 H12 A12,12 0 0 1 0,52 V38 A3,3 0 0 1 3,35 Z"/>
      </symbol>
      <symbol id="qm-cell" viewBox="0 0 64 64">
        <path d="M38,35 H61 A3,3 0 0 1 64,38 V64 H38 A3,3 0 0 1 35,61 V38 A3,3 0 0 1 38,35 Z"/>
      </symbol>
    </defs>
  </svg>
  <div class="app">
    <!-- LEFT SIDEBAR (Linear Style) -->
    <aside class="sidebar" id="sidebarEl">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg viewBox="0 0 64 64" class="qm-logo-mark"><use href="#qm-grid" class="qm-grid"/><use href="#qm-cell" class="qm-cell"/></svg>
          <span class="qm-wordmark"><b>Query</b><span>Mind</span></span>
        </div>
      </div>

      <div class="sidebar-content">
        <!-- DATASET SUMMARY SLOT (when loaded) -->
        <div id="sidebarDatasetSlot" class="sb-section" style="display: none;"></div>

        <!-- DYNAMIC SCHEMA EXPLORER -->
        <div id="sidebarSchema" class="sb-section"></div>

        <!-- RECENT QUERY HISTORY -->
        <div id="sidebarHistory" class="sb-section"></div>

        <!-- PRIVACY INDICATOR (at bottom) -->
        <div id="privacyIndicatorSlot" class="sidebar-privacy"></div>
      </div>
    </aside>

    <!-- MAIN WORKSPACE (Perplexity × Hex × Vercel) -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-icon mobile-toggle" id="mobileMenuBtn" aria-label="Toggle Menu">
            ☰
          </button>
          <a class="topbar-brand" href="#">
            <svg viewBox="0 0 64 64" class="qm-logo-mark"><use href="#qm-grid" class="qm-grid"/><use href="#qm-cell" class="qm-cell"/></svg>
            <span class="qm-wordmark"><b>Query</b><span>Mind</span></span>
          </a>
          <span class="topbar-divider"></span>
          <div id="topbarDatasetBadge" class="dataset-badge-top" style="display: none;">
            <span class="dot"></span>
            <span id="topbarDatasetText">customers.csv</span>
          </div>
        </div>
        <div class="topbar-right">
          <!-- Key controls injected here by ApiKeyModal: Provider pill & Key Settings -->
        </div>
      </header>

      <div class="content-container">
        <!-- CSV UPLOADER SLOT (Dropzone) -->
        <div id="uploaderSlot"></div>

        <!-- QUERY HERO & INPUT WRAPPER (Shown when dataset loaded) -->
        <div id="queryWorkspaceWrap" class="query-container" style="display: none;">
          <div class="hero-state" id="heroState">
            <div class="qm-stacked-logo">
              <svg viewBox="0 0 64 64" class="qm-logo-mark-lg"><use href="#qm-grid" class="qm-grid"/><use href="#qm-cell" class="qm-cell"/></svg>
              <div class="qm-wordmark-lg"><b>Query</b><span>Mind</span></div>
            </div>
            <h2 class="hero-title" style="margin-top: 16px;">Ask your data anything.</h2>
            <p class="hero-subtitle">What would you like to know?</p>
          </div>

          <div class="query-card">
            <textarea
              id="qi"
              class="query-textarea"
              rows="2"
              placeholder="Ask a question about your dataset in plain English..."
              disabled
              autocomplete="off"
              spellcheck="false"
            ></textarea>
            <div class="query-card-footer">
              <span class="query-shortcuts-hint">
                <kbd>⌘↵</kbd> or <kbd>Ctrl+Enter</kbd> to run
              </span>
              <button id="runBtn" class="btn btn-primary" disabled>
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M4 2.5v11l9-5.5-9-5.5z"/>
                </svg>
                <span>Run</span>
              </button>
            </div>
          </div>

          <div class="suggestions-pills" id="exampleChips"></div>
        </div>

        <!-- DYNAMIC RESULTS AREA (AI Stream, Insight, KPIs, Table, SQL Accordion, Tech Details) -->
        <div id="area" class="results-stack"></div>
      </div>
    </main>
  </div>

  <!-- SCRIPT ENTRY POINT -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
